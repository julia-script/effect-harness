name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - name: Require a changeset for pull requests
        if: >-
          github.event_name == 'pull_request' &&
          !(github.event.pull_request.head.repo.full_name == github.repository &&
            github.head_ref == 'changeset-release/main')
        run: bun run check:changesets
      - name: Build root package
        run: bun run build
      - name: Format, strict lint and type checks
        run: bun run check
      - name: Unit, integration and process recovery tests
        run: bun run test
      - name: Verify installed package consumers
        run: bun run test:package
